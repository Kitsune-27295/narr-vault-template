# Fate / Nasuverse Properties Overlay (scaffold, verify against frozen sources)
properties:
  servant_class:
    type: text
    description: Saber, Archer, Lancer, Rider, Caster, Assassin, Berserker or an extra class.
  true_name:
    type: text
    description: True name of a Servant.
  master:
    type: text
    description: Master a Servant is bound to.
  parameter_ranks:
    type: text
    description: Parameter ranks as STR/END/AGI/MAG/LUK/NP in order, e.g. B/A/B/C/D/A.
  np_rank:
    type: text
    description: Rank of a Noble Phantasm.
  np_type:
    type: text
    description: Anti-Unit, Anti-Army, Anti-Fortress, Anti-Country, Anti-World or Barrier.
  np_range:
    type: text
    description: Range of a Noble Phantasm.
  magecraft_origin:
    type: text
    description: School or lineage of a magus.
  command_seals:
    type: number
    description: Command Seals remaining.
