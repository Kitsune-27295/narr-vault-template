# Multiverse Crossover Properties Overlay
properties:
  origin_universe:
    type: text
    description: Designation of native home reality.
  current_reality:
    type: text
    description: Current dimension or localized timeline coordinate.
  universe_id:
    type: text
    description: Registered identifier of the universe an entity belongs to.
  fandom:
    type: multitext
    description: Source franchises an entity or page draws from.
  canon_origin:
    type: text
    description: Franchise or reality a character is imported from.
  variant_of:
    type: text
    description: Base canonical entity of which this character is an alternate divergence.
  divergence_point:
    type: text
    description: POD or event where a variant parts from its base.
  cosmological_status:
    type: text
    description: Status of the variant within the multiverse (native, displaced, merged).
  anchor_point:
    type: text
    description: Cosmological tether preventing dimensional dispersion or anchor decay.
  anchor_type:
    type: text
    description: Artifact, Location, Entity or Cosmic Constant.
  current_universe:
    type: text
    description: Universe where an anchor currently resides.
  dimensional_resonance:
    type: text
    description: Resonance signature of an anchor.
  stability_index:
    type: number
    description: Local dimensional integrity index (0.0 to 1.0).
  reality_stability:
    type: number
    description: Local dimensional integrity index (0.0 to 1.0 or percentage).
  power_equalization:
    type: text
    description: Law mapping between magic, chakra, reiatsu, soul power and physics.
  power_cap:
    type: text
    description: Ceiling imposed on raw power in a world, if any.
  equalization_basis:
    type: text
    description: Principle used to compare two power systems.
  crossover_origin:
    type: text
    description: Narrative catalyst initiating cross-dimensional displacement.
  travel_method:
    type: text
    description: Vehicle or supernatural conduit (Portal, Bifrost, Void Rift).
