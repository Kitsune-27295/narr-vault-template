# Harry Potter Properties Overlay (scaffold, verify against frozen sources)
properties:
  spell_category:
    type: text
    description: Charm, Transfiguration, Jinx, Hex, Curse, Counter-spell or Potion-based.
  incantation:
    type: text
    description: Spoken incantation of a spell.
  wand_movement:
    type: text
    description: Wand movement used to cast.
  spell_legality:
    type: text
    description: Legal, Restricted or Unforgivable.
  artifact_class:
    type: text
    description: Class of a magical artifact (wand, relic, cursed object, tool).
  artifact_creator:
    type: text
    description: Maker of an artifact.
  owner_chain:
    type: multitext
    description: Ordered list of owners of an artifact.
  hogwarts_house:
    type: text
    description: Hogwarts house of a character.
  blood_status:
    type: text
    description: Muggle-born, Half-blood, Pure-blood or other.
  wand_core:
    type: text
    description: Core and wood of a character's wand.
  patronus:
    type: text
    description: Patronus form, if any.
