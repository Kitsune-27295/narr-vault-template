name: update-vault

# Reusable workflow. A narrative vault\'s own `narr-update.yml` calls it every week:
#
#   uses: Kitsune-27295/narr-vault-template/.github/workflows/update-vault.yml@stable
#
# It installs the newest published `narr`, runs `narr upgrade` on the caller\'s vault, and opens (or
# refreshes) ONE pull request on the branch `narr/framework-update` with the framework files that
# changed. `narr upgrade` never touches manuscripts, lore, canon baselines, memory, or ledgers,
# and a file the author edited is kept, so merging that pull request cannot lose data.

on:
  workflow_call:
    inputs:
      template-ref:
        description: "Ref of the template repository that supplies setup-narr.py"
        type: string
        default: stable
      dry-run:
        description: "Print the plan and open nothing (this repository\'s own validation)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    name: Update the narrative vault
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: narr/framework-update
    steps:
      - name: Choose where narr is installed
        run: echo "NARR_HOME=$RUNNER_TEMP/narr" >> "$GITHUB_ENV"

      - name: Check out the vault
        uses: actions/checkout@v7

      - name: Check out the installer
        uses: actions/checkout@v7
        with:
          repository: Kitsune-27295/narr-vault-template
          ref: ${{ inputs.template-ref }}
          path: .narr-template
          persist-credentials: false

      - name: Keep the installer out of the commit
        run: echo ".narr-template/" >> .git/info/exclude

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the newest narr (sha256-checked)
        run: python .narr-template/setup-narr.py --tool-only

      - name: Upgrade the vault
        run: |
          narr="$NARR_HOME/venv/bin/narr"
          "$narr" upgrade --json > "$RUNNER_TEMP/plan.json"
          jq -r \'.[] | select(.action != "current") | "\(.action)\t\(.path)"\' "$RUNNER_TEMP/plan.json"
          "$NARR_HOME/venv/bin/python" -c "import narr; print(narr.__version__)" > "$RUNNER_TEMP/version"

      - name: Open or refresh the pull request
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_REF: ${{ inputs.template-ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already up to date; no pull request."
            exit 0
          fi
          version="$(cat "$RUNNER_TEMP/version")"
          {
            echo "Framework files changed by \`narr upgrade\` ($version). Your manuscripts, lore, memory and canon baselines are untouched."
            echo
            echo \'| action | file |\'
            echo \'|---|---|\'
            jq -r \'.[] | select(.action != "current") | "| \(.action) | `\(.path)` |"\' "$RUNNER_TEMP/plan.json"
            echo
            echo \'A row marked `kept` is a file you edited: it was left exactly as it is.\'
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -q -m "Update narr framework files to $version" \
            -m "Automatic via update-vault (Kitsune-27295/narr-vault-template@${TEMPLATE_REF})."
          git push --force origin "$BRANCH"

          base="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq \'.[0].number\')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Update narr to $version" --body-file "$RUNNER_TEMP/body.md"
            echo "Refreshed pull request #$existing"
          elif ! gh pr create --base "$base" --head "$BRANCH" --title "Update narr to $version" \
                 --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::The update is on branch $BRANCH but a pull request could not be opened."
            echo "::error::Enable Settings > Actions > General > \'Allow GitHub Actions to create and approve pull requests\', or open the pull request from that branch by hand."
            exit 1
          fi
