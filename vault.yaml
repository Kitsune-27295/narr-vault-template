# ==============================================================================
# Vault Declarative Configuration: Narrative Vault Framework
# Single source of truth for story metadata, tiers, languages, modules & budgets.
# ==============================================================================
schema: 1

story:
  title: "Untitled Narrative Project"
  fandoms: []   # source universes this project draws on
  tier: "T2"
  rating: "Not Rated"   # e.g. an AO3 rating
  authoritative_calendar: ""   # e.g. Canon/<Franchise>/Baselines/Baseline_Master_Chronology_Timeline.md
  epoch: ""   # e.g. "Founding Year 0"; all dated events count forward from it
  opening_date: ""   # where the story opens on that calendar

languages:
  drafting: "pt-BR"
  publication: "es"
  reference: "en-US"

# Character sheet modules recognized across the vault
modules:
  - "Identity"
  - "Appearance"
  - "Personality"
  - "Voice"
  - "Decision_Logic"
  - "Rank_and_Progression"
  - "Powers_and_Costs"
  - "Techniques"
  - "Equipment"
  - "Affiliation_and_Cohort"
  - "State_as_of"

# Required sections per character tier
character_required:
  T1:
    - "Identity"
    - "Appearance"
    - "Personality"
    - "Voice"
    - "Decision_Logic"
    - "Rank_and_Progression"
    - "Powers_and_Costs"
    - "Techniques"
    - "Equipment"
    - "Affiliation_and_Cohort"
    - "State_as_of"
  T2:
    - "Identity"
    - "Rank_and_Progression"
    - "Powers_and_Costs"
    - "State_as_of"
  T3:
    - "Identity"
    - "State_as_of"

# Continuity tracking thresholds
thresholds:
  chekhov_gap: 3          # Maximum chapters a planted element may go unpaid before report
  thread_dormant_gap: 5   # Maximum chapters an open thread may stay dormant before report

# Operational context budgets
budgets:
  hot_lines: 60           # Maximum lines in memory/hot.md
  agents_lines: 200       # Target line ceiling for operational contract
  note_bytes: 65536       # Maximum recommended bytes per single content note (64 KB)

