version: "3.0"
vault_id: "narrative-story-bible-template"
title: "Narrative Story Bible Template"
description: "Framework-template for long-form narrative fiction vaults (fanfic, original)"

narr:
  version: ">=2.0"

locales:
  draft: "pt-BR"
  publish: "es"
  system: "en-US"

budgets:
  agents_md_max_lines: 200
  hot_memory_max_lines: 60
  chapter_target_words: 4500
  max_context_tokens: 3500
  operational_file_max_bytes: 307200

# Advisory prose checks (warnings STY001-STY005) for chapters in 04_Manuscript; densities are per 1000 words.
style:
  enabled: true
  filter_per_1000_max: 25
  adverb_per_1000_max: 12
  rhythm_min_stdev: 4
  opener_run_max: 3
  tics_max: 3
  min_chapter_words: 300

# Authority of canon media, highest first. Dossiers record lower-ranked variants in section 5.
canon_authority: [source_text, adaptation, fanon, inference]

scopes:
  default: "fanfic_canon"
  hierarchy:
    source_canon:
      parent: null
      can_see: ["source_canon"]
    fanfic_canon:
      parent: "source_canon"
      can_see: ["source_canon", "fanfic_canon"]
    au_alternate:
      parent: "source_canon"
      can_see: ["source_canon", "au_alternate"]
    au_divergence:
      parent: "source_canon"
      can_see: ["source_canon", "fanfic_canon", "au_divergence"]
    sandbox:
      parent: null
      can_see: ["sandbox"]

git:
  commit_types: ["canon", "source", "bible", "timeline", "manuscript", "pod", "ledger", "meta", "fix", "refactor", "chore"]
  require_lint_pass: true
